spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/devdb
    username: devuser
    password: devpass
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      indent_output: true
server:
  port: 8080
